name: Sync kpomes into shaunalynn.org

on:
  push:
    branches: [master]
    paths: ['.github/workflows/sync-kpomes.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-kpomes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out personal website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out poetry site
        uses: actions/checkout@v4
        with:
          repository: shduff/kpomes
          ref: master
          path: _kpomes_source
          persist-credentials: false
      - name: Copy published files without changing the rest of the site
        run: |
          mkdir -p kpomes
          rsync -a --delete --exclude='CNAME' _kpomes_source/public/ kpomes/
          touch kpomes/.nojekyll
          rm -rf _kpomes_source
      - name: Commit updates if anything changed
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A kpomes
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync kpomes published files"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages rebuild after bot commit
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/pages/builds || echo "Automatic Pages rebuild unavailable; site files are committed and will publish on next normal Pages build."
